set -g prefix "C-a"

# Act like Vim
setw -g mode-keys vi      # vi keys in copy/scroll mode
# NOTE: status-keys (vi keys at the <P> : command prompt) is set at the very
# bottom, AFTER tpm runs — tmux-sensible force-sets it to emacs, so it has to
# be overridden last to stick.
#bind-key h select-pane -L
#bind-key j select-pane -D
#bind-key k select-pane -U
#bind-key l select-pane -R

# Look good — true color (24-bit) so Dracula renders correctly in Neovim
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# Clipboard ---------------------------------------------------------------
# Pick the right copy command for the platform:
#   macOS            -> pbcopy
#   Linux (Wayland)  -> wl-copy   (if WAYLAND_DISPLAY is set)
#   Linux (X11)      -> xclip
# The shell picks one at config-load time; install the relevant tool
# (wl-clipboard or xclip) on Linux.
if-shell 'command -v pbcopy' \
  'set -g @copy_cmd "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' \
  'set -g @copy_cmd "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip' \
  'set -g @copy_cmd "xclip -selection clipboard -in"'

# Mouse support ----------------------------------------------------------
set -g mouse on

bind-key -T copy-mode-vi WheelUpPane send -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -X scroll-down

# Vi copypaste — pipe the selection to the platform clipboard command above
# (mode-keys vi is set once near the top)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_cmd}" \; display-message "highlighted selection copied to system clipboard"

# Double clicking selects the word also when not in copy-mode.
bind-key -T root DoubleClick1Pane  select-pane \; copy-mode \; send-keys -X select-word

# scrollback buffer size increase
set -g history-limit 500000

# C-b C-b will swap to last used window
bind-key C-b last-window

# Tab-switching muscle memory: move between windows with no prefix on M-{ / M-}
# (ESC{ / ESC}). Trigger it with Cmd-Shift-[ / ] on macOS (Ghostty rewrites those
# to this sequence — see config/ghostty/config) or Alt-Shift-[ / ] on Linux (Alt
# is Meta, sends it directly). Keys are quoted: tmux treats bare { } as command-
# block delimiters.
bind -n "M-{" previous-window
bind -n "M-}" next-window

# Start tab numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Highlight active window
# set-window-option -g window-status-current-bg red
set -g window-status-style 'fg=cyan,bg=black'
set -g window-status-current-style 'fg=cyan,bg=red'

# use different keys to split vertical and horizonal
#bind | split-window -h
#bind - split-window -v
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Change cursor in vim to distinguish between insert and command mode
# Use in conjunciton with tmux-cursors.vim
set-option -g terminal-overrides '*88col*:colors=88,*256col*:colors=256,xterm*:XT:Ms=\E]52;%p1%s;%p2%s\007:Cc=\E]12;%p1%s\007:Cr=\E]112\007:Cs=\E]50;CursorShape=%?%p1%{3}%<%t%{0}%e%p1%{2}%-%;%d\007'

# use C-b v to paste the tmux buffer
bind v paste-buffer

############################################################################
# saving vim sessions
############################################################################
set -g @resurrect-strategy-vim 'session'

############################################################################
# Status Bar
############################################################################
# set-option -g status-utf8 on
#set-option -g status-justify right
set-option -g status-bg black # colour213 # pink
# set-option -g status-fg cyan
set-option -g status-interval 5
set-option -g status-left-length 30
#set-option -g status-left '#[fg=magenta]» #[fg=blue,bold]#T#[default]'
set-option -g status-left '#[fg=magenta]» #[default]'
# git branch of the ACTIVE pane's directory (scoped via pane_current_path;
# --show-current prints just the branch, blank when not in a repo).
set-option -g status-right '#[fg=red,bold][[ #(cd #{pane_current_path} && git branch --show-current 2>/dev/null) ]] #[fg=cyan]»» #[fg=blue,bold]###S #[fg=magenta]%R %m-%d#(acpi | cut -d ',' -f 2)#[default]'
set-option -g visual-activity on

# Titles (window number, program name, active (or not)
#set-option -g set-titles on
#set-option -g set-titles-string '#H:#S.#I.#P #W #T'

############################################################################
# Bindings
############################################################################
# reload tmux conf
bind-key r source-file ~/.tmux.conf

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                 tmux select-pane -L"

bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                 ($is_fzf && tmux send-keys C-j) || \
                 tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                 ($is_fzf && tmux send-keys C-k)  || \
                 tmux select-pane -U"

bind -n C-l run "($is_vim && tmux send-keys C-l) || \
                 tmux select-pane -R"

# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Install tpm with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Restart with: tmux source ~/.tmux.conf
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'

# Initialize TMUX plugin manager (keep this near the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Overrides that must beat a plugin's defaults — tmux-sensible unconditionally
# sets `status-keys emacs`, so re-assert vi keys at the command prompt AFTER tpm.
set -g status-keys vi

# Put the status bar at the top. Set after tpm so it wins over the dracula plugin.
set -g status-position top
